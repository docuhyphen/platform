AWSTemplateFormatVersion: "2010-09-09"
Description: DocuHyphen MVP Production Stack - af-south-1

Parameters:
  AppName:
    Type: String
    Default: docuhyphen

  ECRImageURI:
    Type: String
    Description: Full ECR image URI e.g. 123456789.dkr.ecr.af-south-1.amazonaws.com/docuhyphen:latest

  DBUsername:
    Type: String
    Default: docuhyphen

  CertificateArn:
    Type: String
    Description: ACM certificate ARN for HTTPS on ALB (must be in af-south-1). Leave blank to use HTTP only.
    Default: ""

  CloudFrontCertificateArn:
    Type: String
    Description: ACM certificate ARN for the website domain. The certificate must be in us-east-1. Leave blank to use the CloudFront domain.
    Default: ""

  WebsiteDomainName:
    Type: String
    Default: www.docuhyphen.com

  WebAppDomainName:
    Type: String
    Default: app.docuhyphen.com

  ApiDomainName:
    Type: String
    Default: api.docuhyphen.com

  SesRegion:
    Type: String
    Default: us-east-1
    Description: AWS Region containing the verified SES sender identity.

  AppAdminBootstrapEmail:
    Type: String
    Default: ""
    Description: Existing user email promoted to the first App Admin when no App Admin exists.

  ApplicationEnabled:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "false"
    Description: Creates the ECS service after images and externally generated signing keys are ready.

  AppPort:
    Type: Number
    Default: 8080

  AuditArchiveRetentionDays:
    Type: Number
    Description: >-
      Object Lock (Governance mode) retention period, in days, applied to every
      object written to the audit archive bucket.
    Default: 2555

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  HasCloudFrontCertificate: !Not [!Equals [!Ref CloudFrontCertificateArn, ""]]
  DeployApplication: !Equals [!Ref ApplicationEnabled, "true"]
  DeployApplicationWithCertificate: !And
    - !Condition DeployApplication
    - !Condition HasCertificate

Resources:

  # ─── VPC ────────────────────────────────────────────────────────────────────

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Two public subnets (ALB requires 2 AZs minimum)
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-public-b

  # Two private subnets for RDS (RDS subnet group requires 2 AZs)
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-private-a

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-private-b

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # ─── SECURITY GROUPS ────────────────────────────────────────────────────────

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP/HTTPS from internet
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic from ALB only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref AppPort
          ToPort: !Ref AppPort
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow Postgres from ECS only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ECSSecurityGroup

  # ─── SECRETS MANAGER ────────────────────────────────────────────────────────

  JWTSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${AppName}/jwt-secret
      Description: JWT signing secret for DocuHyphen
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  # WORM archive manifest signing key.
  # CloudFormation cannot generate an RSA keypair, so this secret is created
  # with a placeholder value. The deployment bootstrap populates it before
  # ApplicationEnabled is set to true using the JSON shape expected by
  # SecretsManagerAuditArchiveSigningKeyProvider:
  #   { "keyId": "...", "privateKeyPem": "...", "publicKeyPem": "..." }
  # The ECS service is not created until the keypair has been populated.
  AuditArchiveSigningSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${AppName}/audit-archive-signing-key
      Description: >-
        RSA signing keypair for audit archive segment manifests.
        Populate manually; CloudFormation only reserves the secret slot.
      SecretString: |
        {
          "keyId": "unset",
          "privateKeyPem": "unset",
          "publicKeyPem": "unset"
        }

  # Crypto-shredding master key. A single
  # base64 AES-256 key, not per-subject - per-subject data keys live wrapped
  # in the audit_identity_vault_key table, so this is the only identity-vault
  # secret ever created. A stable random source is generated by CloudFormation.
  AuditIdentityVaultMasterKeySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${AppName}/audit-identity-vault-master-key
      Description: Stable random source used to derive the AES-256 master key wrapping per-subject audit crypto-shredding data keys.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  # ─── RDS POSTGRESQL ─────────────────────────────────────────────────────────

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for RDS
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB

  RDSInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub ${AppName}-postgres
      DBInstanceClass: db.t3.small
      Engine: postgres
      MasterUsername: !Ref DBUsername
      ManageMasterUserPassword: true
      DBName: docuhyphen
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      BackupRetentionPeriod: 7
      DeletionProtection: true
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-postgres

  # ─── ECR ────────────────────────────────────────────────────────────────────

  ECRRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub ${AppName}
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep last 5 images",
              "selection": {
                "tagStatus": "any",
                "countType": "imageCountMoreThan",
                "countNumber": 5
              },
              "action": { "type": "expire" }
            }]
          }

  # ─── ECS ────────────────────────────────────────────────────────────────────

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${AppName}-cluster
      CapacityProviders:
        - FARGATE
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

  CloudWatchLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /ecs/${AppName}
      RetentionInDays: 30

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-ecs-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !GetAtt RDSInstance.MasterUserSecret.SecretArn

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-ecs-task-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3DocumentAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DocumentsBucket.Arn
                  - !Sub ${DocumentsBucket.Arn}/*
        - PolicyName: S3DocumentPreviewAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DocumentPreviewsBucket.Arn
                  - !Sub ${DocumentPreviewsBucket.Arn}/*
        - PolicyName: S3ProfilePictureAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt ProfilePicturesBucket.Arn
                  - !Sub ${ProfilePicturesBucket.Arn}/*
        # WORM archive access. Deliberately
        # excludes s3:DeleteObject, s3:PutObjectRetention and any legal-hold
        # or retention-bypass actions - the app may only write once and read
        # back segments/manifests it already wrote. Object Lock (Governance)
        # on the bucket itself is the tamper-resistance backstop.
        - PolicyName: S3AuditArchiveAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt AuditArchiveBucket.Arn
                  - !Sub ${AuditArchiveBucket.Arn}/*
        - PolicyName: ManagedSecretReadAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Ref JWTSecret
                  - !Ref AuditArchiveSigningSecret
                  - !Ref AuditIdentityVaultMasterKeySecret
        - PolicyName: OrganizationIdentityProviderSecretLifecycle
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:ListSecretVersionIds
                  - secretsmanager:UpdateSecretVersionStage
                  - secretsmanager:DescribeSecret
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                  - secretsmanager:DeleteSecret
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AppName}/org/*
        - PolicyName: SESAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                Resource: "*"

  ECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AppName}-task
      Cpu: "1024"
      Memory: "2048"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        # ── Spring Boot app ──
        - Name: app
          Image: !Ref ECRImageURI
          Essential: true
          Cpu: 896
          Memory: 1536
          MemoryReservation: 1280
          DependsOn:
            - ContainerName: redis
              Condition: HEALTHY
          PortMappings:
            - ContainerPort: !Ref AppPort
              Protocol: tcp
          Environment:
            - Name: QUARKUS_PROFILE
              Value: prod
            - Name: REDIS_HOSTS
              Value: redis://localhost:6379
            - Name: QUARKUS_DATASOURCE_JDBC_URL
              Value: !Sub jdbc:postgresql://${RDSInstance.Endpoint.Address}:${RDSInstance.Endpoint.Port}/docuhyphen
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: JWT_SECRET_ID
              Value: !Ref JWTSecret
            - Name: FILE_STORAGE_AWS_BUCKET
              Value: !Ref DocumentsBucket
            - Name: FILE_STORAGE_AWS_REGION
              Value: !Ref AWS::Region
            - Name: DOCUMENT_THUMBNAIL_STORAGE_SERVICE
              Value: aws
            - Name: DOCUMENT_THUMBNAIL_STORAGE_AWS_BUCKET
              Value: !Ref DocumentPreviewsBucket
            - Name: DOCUMENT_THUMBNAIL_STORAGE_AWS_REGION
              Value: !Ref AWS::Region
            - Name: PROFILE_PICTURE_STORAGE_SERVICE
              Value: aws
            - Name: PROFILE_PICTURE_STORAGE_AWS_BUCKET
              Value: !Ref ProfilePicturesBucket
            - Name: PROFILE_PICTURE_STORAGE_AWS_REGION
              Value: !Ref AWS::Region
            - Name: APP_EMAIL_SES_REGION
              Value: !Ref SesRegion
            - Name: APP_ADMIN_BOOTSTRAP_EMAIL
              Value: !Ref AppAdminBootstrapEmail
            - Name: APP_SECRETS_ORG_IDP_PREFIX
              Value: !Sub ${AppName}/org
            - Name: APP_SECRETS_ORG_IDP_REGION
              Value: !Ref AWS::Region
            - Name: APP_BASE_URL
              Value: !Sub https://${WebAppDomainName}
            - Name: CORS_ORIGINS
              Value: !Sub https://${WebsiteDomainName},https://${WebAppDomainName}
            - Name: MICROSOFT_REDIRECT_URI
              Value: !Sub https://${ApiDomainName}/auth/oauth/MICROSOFT/callback
            - Name: GOOGLE_REDIRECT_URI
              Value: !Sub https://${ApiDomainName}/auth/oauth/GOOGLE/callback
            - Name: APP_AUDIT_ARCHIVE_STORAGE_TYPE
              Value: aws
            - Name: APP_AUDIT_ARCHIVE_BUCKET
              Value: !Ref AuditArchiveBucket
            - Name: APP_AUDIT_ARCHIVE_REGION
              Value: !Ref AWS::Region
            - Name: APP_AUDIT_ARCHIVE_SIGNING_PROVIDER
              Value: aws
            - Name: APP_AUDIT_ARCHIVE_SIGNING_SECRET_ID
              Value: !Ref AuditArchiveSigningSecret
            - Name: APP_AUDIT_ARCHIVE_SIGNING_REGION
              Value: !Ref AWS::Region
            - Name: APP_AUDIT_IDENTITY_VAULT_PROVIDER
              Value: aws
            - Name: APP_AUDIT_IDENTITY_VAULT_SECRET_ID
              Value: !Ref AuditIdentityVaultMasterKeySecret
            - Name: APP_AUDIT_IDENTITY_VAULT_REGION
              Value: !Ref AWS::Region
          Secrets:
            - Name: DB_USERNAME
              ValueFrom: !Join
                - ":"
                - - !GetAtt RDSInstance.MasterUserSecret.SecretArn
                  - username
                  - ""
                  - ""
            - Name: DB_PASSWORD
              ValueFrom: !Join
                - ":"
                - - !GetAtt RDSInstance.MasterUserSecret.SecretArn
                  - password
                  - ""
                  - ""
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CloudWatchLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
          HealthCheck:
            Command:
              - CMD-SHELL
              - !Sub "curl -f http://localhost:${AppPort}/q/health || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

        # ── Redis sidecar (replace with ElastiCache when first customer signs up) ──
        - Name: redis
          Image: redis:7-alpine
          Essential: true
          Cpu: 128
          Memory: 512
          MemoryReservation: 256
          PortMappings:
            - ContainerPort: 6379
              Protocol: tcp
          Command:
            - redis-server
            - --maxmemory
            - 384mb
            - --maxmemory-policy
            - allkeys-lru
            - --appendonly
            - "yes"
          HealthCheck:
            Command:
              - CMD-SHELL
              - redis-cli ping | grep PONG || exit 1
            Interval: 10
            Timeout: 5
            Retries: 5
            StartPeriod: 10
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CloudWatchLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: redis

  # ─── ALB ────────────────────────────────────────────────────────────────────

  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Condition: DeployApplication
    Properties:
      Name: !Sub ${AppName}-alb
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref ALBSecurityGroup

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: DeployApplication
    Properties:
      Name: !Sub ${AppName}-tg
      Port: !Ref AppPort
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VPC
      HealthCheckPath: /q/health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  ALBListenerHTTP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: DeployApplication
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref ALBTargetGroup

  ALBListenerHTTPS:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: DeployApplicationWithCertificate
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  # ─── ECS SERVICE ────────────────────────────────────────────────────────────

  ECSService:
    Type: AWS::ECS::Service
    Condition: DeployApplication
    DependsOn:
      - ALBListenerHTTP
    Properties:
      ServiceName: !Sub ${AppName}-service
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref ECSTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnetA
            - !Ref PublicSubnetB
          SecurityGroups:
            - !Ref ECSSecurityGroup
      LoadBalancers:
        - ContainerName: app
          ContainerPort: !Ref AppPort
          TargetGroupArn: !Ref ALBTargetGroup
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      HealthCheckGracePeriodSeconds: 120

  # ─── S3 WEBSITE ─────────────────────────────────────────────────────────────

  # ─── CLOUDFRONT ─────────────────────────────────────────────────────────────

  # ─── DOCUMENT STORAGE BUCKET ────────────────────────────────────────────────

  DocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${AppName}-${AWS::AccountId}-${AWS::Region}-documents-prod
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  DocumentPreviewsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${AppName}-${AWS::AccountId}-${AWS::Region}-document-previews-prod
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  # ─── PROFILE PICTURE BUCKET ─────────────────────────────────────────────────
  # Stores user profile pictures (avatars). Kept separate from document and
  # thumbnail storage so avatar objects are managed and secured independently.
  ProfilePicturesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${AppName}-${AWS::AccountId}-${AWS::Region}-profile-pictures-prod
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  # ─── AUDIT ARCHIVE BUCKET ──────────────────────────────────────────────────
  # WORM store for signed audit ledger segments. Versioning + Object Lock in
  # Governance mode make objects immutable for AuditArchiveRetentionDays even
  # to the app's own IAM role, which is granted PutObject/GetObject only (see
  # ECSTaskRole's S3AuditArchiveAccess policy above) - no DeleteObject, no
  # PutObjectRetention/PutObjectLegalHold, no retention-bypass permission.
  AuditArchiveBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${AppName}-${AWS::AccountId}-${AWS::Region}-audit-archive-prod
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: !Ref AuditArchiveRetentionDays
      LifecycleConfiguration:
        Rules:
          - Id: DeleteIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  # Detects the ERROR-level log line AuditArchiveScheduler emits
  # ("AUDIT_ARCHIVE_VERIFICATION_FAILED ...") whenever a scheduled
  # re-verification of a closed segment fails integrity checks.
  AuditArchiveVerificationFailedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudWatchLogGroup
      FilterPattern: '"AUDIT_ARCHIVE_VERIFICATION_FAILED"'
      MetricTransformations:
        - MetricName: AuditArchiveVerificationFailed
          MetricNamespace: !Sub ${AppName}/AuditArchive
          MetricValue: "1"
          DefaultValue: 0

  # No AlarmActions wired up yet (would require an SNS topic, a new AWS
  # service type not currently approved - see AGENTS.md infra/cost rules).
  # The alarm still surfaces in the CloudWatch console/API for manual or
  # future notification wiring once approved.
  AuditArchiveVerificationFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AppName}-audit-archive-verification-failed
      AlarmDescription: Fires when a scheduled audit archive segment re-verification fails integrity checks.
      Namespace: !Sub ${AppName}/AuditArchive
      MetricName: AuditArchiveVerificationFailed
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # Detects the ERROR-level log line AuditHealthMonitorScheduler emits
  # ("AUDIT_OUTBOX_BACKLOG_HIGH ...") when the oldest undrained audit_outbox
  # row exceeds app.audit.health.outbox-max-age-minutes.
  AuditOutboxBacklogHighMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudWatchLogGroup
      FilterPattern: '"AUDIT_OUTBOX_BACKLOG_HIGH"'
      MetricTransformations:
        - MetricName: AuditOutboxBacklogHigh
          MetricNamespace: !Sub ${AppName}/AuditHealth
          MetricValue: "1"
          DefaultValue: 0

  AuditOutboxBacklogHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AppName}-audit-outbox-backlog-high
      AlarmDescription: Fires when the audit outbox has an undrained row older than the configured threshold.
      Namespace: !Sub ${AppName}/AuditHealth
      MetricName: AuditOutboxBacklogHigh
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # Detects the ERROR-level log line AuditHealthMonitorScheduler emits
  # ("AUDIT_ANALYTICS_PROJECTION_LAG_HIGH ...") when the analytics projection
  # falls more than app.audit.health.analytics-lag-threshold events behind the ledger.
  AuditAnalyticsProjectionLagHighMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudWatchLogGroup
      FilterPattern: '"AUDIT_ANALYTICS_PROJECTION_LAG_HIGH"'
      MetricTransformations:
        - MetricName: AuditAnalyticsProjectionLagHigh
          MetricNamespace: !Sub ${AppName}/AuditHealth
          MetricValue: "1"
          DefaultValue: 0

  AuditAnalyticsProjectionLagHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AppName}-audit-analytics-projection-lag-high
      AlarmDescription: Fires when the audit analytics projection falls too far behind the ledger.
      Namespace: !Sub ${AppName}/AuditHealth
      MetricName: AuditAnalyticsProjectionLagHigh
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

# ─── OUTPUTS ──────────────────────────────────────────────────────────────────

Outputs:
  ALBDNSName:
    Condition: DeployApplication
    Description: ALB DNS (for Route53 alias or debugging)
    Value: !GetAtt ALB.DNSName

  RDSEndpoint:
    Description: RDS host (for app environment variables)
    Value: !GetAtt RDSInstance.Endpoint.Address

  ECRRepositoryURI:
    Description: ECR repository URI (push your Docker image here)
    Value: !GetAtt ECRRepository.RepositoryUri

  ECSClusterName:
    Description: ECS cluster name
    Value: !Ref ECSCluster

  ECSServiceName:
    Condition: DeployApplication
    Description: ECS service name
    Value: !GetAtt ECSService.Name

  DocumentsBucketName:
    Description: S3 bucket for uploaded documents
    Value: !Ref DocumentsBucket

  DocumentPreviewsBucketName:
    Description: S3 bucket for generated document preview thumbnails
    Value: !Ref DocumentPreviewsBucket

  ProfilePicturesBucketName:
    Description: S3 bucket for user profile pictures (avatars)
    Value: !Ref ProfilePicturesBucket

  AuditArchiveBucketName:
    Description: S3 bucket for signed audit archive segments
    Value: !Ref AuditArchiveBucket

