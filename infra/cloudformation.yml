AWSTemplateFormatVersion: "2010-09-09"
Description: DocuHyphen MVP Production Stack - af-south-1

Parameters:
  AppName:
    Type: String
    Default: docuhyphen

  ECRImageURI:
    Type: String
    Description: Full ECR image URI e.g. 123456789.dkr.ecr.af-south-1.amazonaws.com/docuhyphen:latest

  DBPassword:
    Type: String
    NoEcho: true
    Description: RDS master password

  DBUsername:
    Type: String
    Default: docuhyphen

  CertificateArn:
    Type: String
    Description: ACM certificate ARN for HTTPS on ALB (must be in af-south-1). Leave blank to use HTTP only.
    Default: ""

  AppPort:
    Type: Number
    Default: 8080

  AuditArchiveRetentionDays:
    Type: Number
    Description: >-
      Object Lock (Governance mode) retention period, in days, applied to every
      object written to the audit archive bucket.
    Default: 2555

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]

Resources:

  # ─── VPC ────────────────────────────────────────────────────────────────────

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Two public subnets (ALB requires 2 AZs minimum)
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: af-south-1a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: af-south-1b
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-public-b

  # Two private subnets for RDS (RDS subnet group requires 2 AZs)
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: af-south-1a
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-private-a

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: af-south-1b
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-private-b

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # ─── SECURITY GROUPS ────────────────────────────────────────────────────────

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP/HTTPS from internet
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic from ALB only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref AppPort
          ToPort: !Ref AppPort
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow Postgres from ECS only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ECSSecurityGroup

  # ─── SECRETS MANAGER ────────────────────────────────────────────────────────

  DBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AppName}/db-credentials
      Description: RDS credentials for DocuHyphen
      SecretString: !Sub |
        {
          "username": "${DBUsername}",
          "password": "${DBPassword}"
        }

  # WORM archive manifest signing key.
  # CloudFormation cannot generate an RSA keypair, so this secret is created
  # with a placeholder value and must be populated post-deploy (one time,
  # out of band) with the real JSON shape expected by
  # SecretsManagerAuditArchiveSigningKeyProvider:
  #   { "keyId": "...", "privateKeyPem": "...", "publicKeyPem": "..." }
  # Until populated, app.audit.archive.signing-provider should stay "local".
  AuditArchiveSigningSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AppName}/audit-archive-signing-key
      Description: >-
        RSA signing keypair for audit archive segment manifests.
        Populate manually; CloudFormation only reserves the secret slot.
      SecretString: |
        {
          "keyId": "unset",
          "privateKeyPem": "unset",
          "publicKeyPem": "unset"
        }

  # Crypto-shredding master key. A single
  # base64 AES-256 key, not per-subject - per-subject data keys live wrapped
  # in the audit_identity_vault_key table, so this is the only identity-vault
  # secret ever created. Placeholder value, populate manually post-deploy.
  # Until populated, app.audit.identity-vault.provider should stay "local".
  AuditIdentityVaultMasterKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AppName}/audit-identity-vault-master-key
      Description: >-
        Base64 AES-256 master key wrapping per-subject audit crypto-shredding
        data keys. Populate manually; CloudFormation only reserves
        the secret slot.
      SecretString: unset

  # ─── RDS POSTGRESQL ─────────────────────────────────────────────────────────

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for RDS
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB

  RDSInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub ${AppName}-postgres
      DBInstanceClass: db.t3.micro
      Engine: postgres
      EngineVersion: "16.3"
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBName: docuhyphen
      AllocatedStorage: "20"
      StorageType: gp2
      MultiAZ: false
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      BackupRetentionPeriod: 7
      DeletionProtection: true
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-postgres

  # ─── ECR ────────────────────────────────────────────────────────────────────

  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${AppName}
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep last 5 images",
              "selection": {
                "tagStatus": "any",
                "countType": "imageCountMoreThan",
                "countNumber": 5
              },
              "action": { "type": "expire" }
            }]
          }

  # ─── ECS ────────────────────────────────────────────────────────────────────

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${AppName}-cluster
      CapacityProviders:
        - FARGATE
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

  CloudWatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AppName}
      RetentionInDays: 30

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-ecs-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DBSecret

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-ecs-task-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3DocumentAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${AppName}-documents-prod
                  - !Sub arn:aws:s3:::${AppName}-documents-prod/*
        # WORM archive access. Deliberately
        # excludes s3:DeleteObject, s3:PutObjectRetention and any legal-hold
        # or retention-bypass actions - the app may only write once and read
        # back segments/manifests it already wrote. Object Lock (Governance)
        # on the bucket itself is the tamper-resistance backstop.
        - PolicyName: S3AuditArchiveAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub arn:aws:s3:::${AppName}-audit-archive-prod
                  - !Sub arn:aws:s3:::${AppName}-audit-archive-prod/*
        - PolicyName: AuditArchiveSigningSecretAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref AuditArchiveSigningSecret
        - PolicyName: AuditIdentityVaultMasterKeySecretAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref AuditIdentityVaultMasterKeySecret

  ECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AppName}-task
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        # ── Spring Boot app ──
        - Name: app
          Image: !Ref ECRImageURI
          Essential: true
          PortMappings:
            - ContainerPort: !Ref AppPort
              Protocol: tcp
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: prod
            - Name: REDIS_HOST
              Value: localhost
            - Name: REDIS_PORT
              Value: "6379"
            - Name: DB_HOST
              Value: !GetAtt RDSInstance.Endpoint.Address
            - Name: DB_PORT
              Value: !GetAtt RDSInstance.Endpoint.Port
            - Name: DB_NAME
              Value: docuhyphen
            - Name: APP_AUDIT_ARCHIVE_STORAGE_TYPE
              Value: aws
            - Name: APP_AUDIT_ARCHIVE_BUCKET
              Value: !Ref AuditArchiveBucket
            - Name: APP_AUDIT_ARCHIVE_REGION
              Value: af-south-1
            # Signing stays "local" until the AuditArchiveSigningSecret is
            # populated with a real keypair post-deploy (see the secret's
            # description); flip to "aws" and set the secret id/region below
            # once that one-time setup is done.
            - Name: APP_AUDIT_ARCHIVE_SIGNING_PROVIDER
              Value: local
          Secrets:
            - Name: DB_USERNAME
              ValueFrom: !Sub "${DBSecret}:username::"
            - Name: DB_PASSWORD
              ValueFrom: !Sub "${DBSecret}:password::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CloudWatchLogGroup
              awslogs-region: af-south-1
              awslogs-stream-prefix: app
          HealthCheck:
            Command:
              - CMD-SHELL
              - !Sub "curl -f http://localhost:${AppPort}/actuator/health || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

        # ── Redis sidecar (replace with ElastiCache when first customer signs up) ──
        - Name: redis
          Image: redis:7-alpine
          Essential: false
          PortMappings:
            - ContainerPort: 6379
              Protocol: tcp
          Command:
            - redis-server
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
            - --appendonly
            - "no"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CloudWatchLogGroup
              awslogs-region: af-south-1
              awslogs-stream-prefix: redis

  # ─── ALB ────────────────────────────────────────────────────────────────────

  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${AppName}-alb
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref ALBSecurityGroup

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${AppName}-tg
      Port: !Ref AppPort
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VPC
      HealthCheckPath: /actuator/health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  ALBListenerHTTP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref ALBTargetGroup

  ALBListenerHTTPS:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  # ─── ECS SERVICE ────────────────────────────────────────────────────────────

  ECSService:
    Type: AWS::ECS::Service
    DependsOn:
      - ALBListenerHTTP
    Properties:
      ServiceName: !Sub ${AppName}-service
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref ECSTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnetA
          SecurityGroups:
            - !Ref ECSSecurityGroup
      LoadBalancers:
        - ContainerName: app
          ContainerPort: !Ref AppPort
          TargetGroupArn: !Ref ALBTargetGroup
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100

  # ─── S3 WEBSITE ─────────────────────────────────────────────────────────────

  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AppName}-website-prod
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebsiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  # ─── CLOUDFRONT ─────────────────────────────────────────────────────────────

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AppName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_All
        Origins:
          # S3 website origin
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
          # ALB API origin
          - Id: APIOrigin
            DomainName: !GetAtt ALB.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: !If [HasCertificate, https-only, http-only]
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          Compress: true
        CacheBehaviors:
          # Route /api/* to ALB
          - PathPattern: /api/*
            TargetOriginId: APIOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
        CustomErrorResponses:
          # SPA fallback for React Router
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  # ─── DOCUMENT STORAGE BUCKET ────────────────────────────────────────────────

  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AppName}-documents-prod
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  # ─── AUDIT ARCHIVE BUCKET ──────────────────────────────────────────────────
  # WORM store for signed audit ledger segments. Versioning + Object Lock in
  # Governance mode make objects immutable for AuditArchiveRetentionDays even
  # to the app's own IAM role, which is granted PutObject/GetObject only (see
  # ECSTaskRole's S3AuditArchiveAccess policy above) - no DeleteObject, no
  # PutObjectRetention/PutObjectLegalHold, no retention-bypass permission.
  AuditArchiveBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AppName}-audit-archive-prod
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: !Ref AuditArchiveRetentionDays
      LifecycleConfiguration:
        Rules:
          - Id: DeleteIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  # Detects the ERROR-level log line AuditArchiveScheduler emits
  # ("AUDIT_ARCHIVE_VERIFICATION_FAILED ...") whenever a scheduled
  # re-verification of a closed segment fails integrity checks.
  AuditArchiveVerificationFailedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudWatchLogGroup
      FilterPattern: '"AUDIT_ARCHIVE_VERIFICATION_FAILED"'
      MetricTransformations:
        - MetricName: AuditArchiveVerificationFailed
          MetricNamespace: !Sub ${AppName}/AuditArchive
          MetricValue: "1"
          DefaultValue: 0

  # No AlarmActions wired up yet (would require an SNS topic, a new AWS
  # service type not currently approved - see AGENTS.md infra/cost rules).
  # The alarm still surfaces in the CloudWatch console/API for manual or
  # future notification wiring once approved.
  AuditArchiveVerificationFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AppName}-audit-archive-verification-failed
      AlarmDescription: Fires when a scheduled audit archive segment re-verification fails integrity checks.
      Namespace: !Sub ${AppName}/AuditArchive
      MetricName: AuditArchiveVerificationFailed
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # Detects the ERROR-level log line AuditHealthMonitorScheduler emits
  # ("AUDIT_OUTBOX_BACKLOG_HIGH ...") when the oldest undrained audit_outbox
  # row exceeds app.audit.health.outbox-max-age-minutes.
  AuditOutboxBacklogHighMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudWatchLogGroup
      FilterPattern: '"AUDIT_OUTBOX_BACKLOG_HIGH"'
      MetricTransformations:
        - MetricName: AuditOutboxBacklogHigh
          MetricNamespace: !Sub ${AppName}/AuditHealth
          MetricValue: "1"
          DefaultValue: 0

  AuditOutboxBacklogHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AppName}-audit-outbox-backlog-high
      AlarmDescription: Fires when the audit outbox has an undrained row older than the configured threshold.
      Namespace: !Sub ${AppName}/AuditHealth
      MetricName: AuditOutboxBacklogHigh
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # Detects the ERROR-level log line AuditHealthMonitorScheduler emits
  # ("AUDIT_ANALYTICS_PROJECTION_LAG_HIGH ...") when the analytics projection
  # falls more than app.audit.health.analytics-lag-threshold events behind the ledger.
  AuditAnalyticsProjectionLagHighMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudWatchLogGroup
      FilterPattern: '"AUDIT_ANALYTICS_PROJECTION_LAG_HIGH"'
      MetricTransformations:
        - MetricName: AuditAnalyticsProjectionLagHigh
          MetricNamespace: !Sub ${AppName}/AuditHealth
          MetricValue: "1"
          DefaultValue: 0

  AuditAnalyticsProjectionLagHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AppName}-audit-analytics-projection-lag-high
      AlarmDescription: Fires when the audit analytics projection falls too far behind the ledger.
      Namespace: !Sub ${AppName}/AuditHealth
      MetricName: AuditAnalyticsProjectionLagHigh
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

# ─── OUTPUTS ──────────────────────────────────────────────────────────────────

Outputs:
  CloudFrontURL:
    Description: Website URL (point your domain CNAME here)
    Value: !Sub https://${CloudFrontDistribution.DomainName}

  ALBDNSName:
    Description: ALB DNS (for Route53 alias or debugging)
    Value: !GetAtt ALB.DNSName

  RDSEndpoint:
    Description: RDS host (for app environment variables)
    Value: !GetAtt RDSInstance.Endpoint.Address

  ECRRepositoryURI:
    Description: ECR repository URI (push your Docker image here)
    Value: !GetAtt ECRRepository.RepositoryUri

  ECSClusterName:
    Description: ECS cluster name
    Value: !Ref ECSCluster

  ECSServiceName:
    Description: ECS service name
    Value: !GetAtt ECSService.Name

  WebsiteBucketName:
    Description: S3 bucket for website (deploy your frontend build here)
    Value: !Ref WebsiteBucket

  DocumentsBucketName:
    Description: S3 bucket for uploaded documents
    Value: !Ref DocumentsBucket

  AuditArchiveBucketName:
    Description: S3 bucket for signed audit archive segments
    Value: !Ref AuditArchiveBucket

