# Staging configuration
app.base-url=${APP_BASE_URL:https://staging.docuhyphen.com}
app.email.subject-title=DocuHyphen (Staging)
app.email.ses.region=${APP_EMAIL_SES_REGION:us-east-1}

# Quarkus Mailer Configuration for Staging
quarkus.mailer.from=staging@docuhyphen.com
quarkus.mailer.auth-methods=DIGEST-MD5

# Logging
quarkus.log.level=DEBUG
quarkus.log.console.enable=true
quarkus.log.file.enable=true
quarkus.log.file.path=logs/application.log
quarkus.log.file.level=DEBUG

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}

# Hibernate,  Flyway owns the schema; Hibernate only validates.
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=true

# JWT secret source
app.security.jwt.secret-provider=aws
app.security.aws.region=${AWS_REGION}
app.security.jwt.aws-secret-id=${JWT_SECRET_ID}

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:https://staging.docuhyphen.com}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-active-organization-id,x-csrf-token,x-share-link-token,x-client-type,x-tab-id,x-tab-token,x-request-id,dpop,dpop-nonce,dpop-bind
quarkus.http.cors.exposed-headers=location,link,set-cookie
quarkus.http.cors.access-control-max-age=24H

# File storage
file.storage.service=aws
file.storage.aws.bucket=${FILE_STORAGE_AWS_BUCKET}
file.storage.aws.region=${FILE_STORAGE_AWS_REGION:af-south-1}

# Redis
quarkus.redis.hosts=${REDIS_HOSTS:redis://localhost:6379}
quarkus.redis.timeout=5s

