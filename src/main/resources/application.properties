#quarkus.jaxrs.filter.classes=your.package.EndpointVerificationFilter

# Application Configuration - DEFAULTS
# These are overridden by profile-specific files (application-local.properties, etc.)
app.base-url=http://localhost:5173
app.email.subject-title=DocuHyphen

# Quarkus Mailer Configuration
quarkus.mailer.from=admin@securedocumentshare.co.za
quarkus.mailer.host=localhost
quarkus.mailer.port=32768
quarkus.mailer.username=admin@securedocumentshare.co.za
quarkus.mailer.password=admin
quarkus.mailer.ssl=false

#Logging
quarkus.log.console.json=false
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{1.}] (%t) %s%e%n
quarkus.log.file.enable=true
quarkus.log.file.path=logs/application.log
quarkus.log.file.level=DEBUG

# Hibernate ORM configuration.
# Schema is managed by Flyway (see below); Hibernate only verifies that mapped entities
# match the DB structure. Override to `none` if you want to skip validation entirely,
# or use the `bootstrap` profile to regenerate V1__initial.sql from current entities.
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=no-file

# Flyway — versioned SQL migrations in src/main/resources/db/migration/
# Files follow Vn__description.sql (e.g. V1__initial.sql, V2__add_user_index.sql).
# `baseline-on-migrate` lets us adopt Flyway on a DB that already has objects (it stamps
# the current state as the baseline). For a clean install the baseline simply records V1.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
quarkus.flyway.baseline-description=Pre-Flyway baseline

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/docu-hyphen-postgres-db
quarkus.datasource.username=postgres
quarkus.datasource.password=admin

quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=location,link,set-cookie
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.access-control-max-age=24H

# File Storage Service Configuration
# Use "local" for local development or "aws" for AWS S3
file.storage.service=aws

# JWT secret source
app.security.jwt.secret-provider=local
app.security.jwt.local-secret=${JWT_SECRET:myverysecurekeythatis32byteslong*)&GAS&G_A(&F9*FDA(&_FD_A(&F+(D&FA}
app.security.aws.region=${AWS_REGION:af-south-1}
 app.security.jwt.aws-secret-id=1

# Region used by AWS Secrets Manager for organization IdP secrets.
app.secrets.org-idp.region=${APP_SECRETS_ORG_IDP_REGION:af-south-1}

# Prefix used to namespace organization IdP secrets.
app.secrets.org-idp.prefix=${APP_SECRETS_ORG_IDP_PREFIX:docuhyphen/org}

# Enables staged rotation lifecycle for organization IdP secrets.
app.secrets.rotation.enabled=${APP_SECRETS_ROTATION_ENABLED:true}

# Number of days between standard organization IdP secret rotations.
app.secrets.rotation.interval-days=${APP_SECRETS_ROTATION_INTERVAL_DAYS:90}

# Overlap window in hours for pending/current secret stage transitions.
app.secrets.rotation.overlap-hours=${APP_SECRETS_ROTATION_OVERLAP_HOURS:24}

# Allows runtime secret resolution to read AWSPREVIOUS during active overlap windows.
app.secrets.rotation.allow-previous-during-overlap=${APP_SECRETS_ROTATION_ALLOW_PREVIOUS_DURING_OVERLAP:true}

# Enables manual rollback to previous secret version during configured overlap windows.
app.secrets.rotation.rollback.enabled=${APP_SECRETS_ROTATION_ROLLBACK_ENABLED:true}

# Requires secret runbook phase to be MONITOR or ACTIVATE before rollback is allowed.
app.secrets.rotation.rollback.require-monitor-phase=${APP_SECRETS_ROTATION_ROLLBACK_REQUIRE_MONITOR_PHASE:true}

# Comma-separated secret rotation phases allowed for runtime IdP client-secret resolution.
app.secrets.rotation.runtime.allowed-phases=${APP_SECRETS_ROTATION_RUNTIME_ALLOWED_PHASES:MONITOR,ACTIVATE}

# OAuth - Microsoft
app.oauth.microsoft.client-id=${MICROSOFT_CLIENT_ID:}
app.oauth.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}
app.oauth.microsoft.tenant-id=${MICROSOFT_TENANT_ID:common}
app.oauth.microsoft.redirect-uri=${MICROSOFT_REDIRECT_URI:http://localhost:8080/auth/oauth/MICROSOFT/callback}

# OAuth - Google
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/auth/oauth/GOOGLE/callback}

# Allowed JWT clock skew (seconds) when validating OIDC temporal claims.
app.oidc.allowed-clock-skew-seconds=${APP_OIDC_ALLOWED_CLOCK_SKEW_SECONDS:120}

# Default access token lifetime in minutes when no org policy is set.
app.auth.access-token-default-minutes=${APP_AUTH_ACCESS_TOKEN_DEFAULT_MINUTES:15}

# Default refresh token lifetime in days when no org policy is set.
app.auth.refresh-token-default-days=${APP_AUTH_REFRESH_TOKEN_DEFAULT_DAYS:7}

# Default max user-session duration in hours when no org policy is set.
app.auth.session-max-default-hours=${APP_AUTH_SESSION_MAX_DEFAULT_HOURS:168}

# Minimum and maximum access-token expiry guardrails in minutes.
app.auth.access-token-min-minutes=${APP_AUTH_ACCESS_TOKEN_MIN_MINUTES:5}
app.auth.access-token-max-minutes=${APP_AUTH_ACCESS_TOKEN_MAX_MINUTES:60}

# Minimum and maximum refresh-token expiry guardrails in days.
app.auth.refresh-token-min-days=${APP_AUTH_REFRESH_TOKEN_MIN_DAYS:1}
app.auth.refresh-token-max-days=${APP_AUTH_REFRESH_TOKEN_MAX_DAYS:30}

# Minimum and maximum max-session-duration guardrails in hours.
app.auth.session-max-min-hours=${APP_AUTH_SESSION_MAX_MIN_HOURS:1}
app.auth.session-max-max-hours=${APP_AUTH_SESSION_MAX_MAX_HOURS:720}

# Require azp claim validation when ID token contains multiple audiences.
app.oidc.validation.require-azp-when-multi-aud=${APP_OIDC_REQUIRE_AZP_WHEN_MULTI_AUD:true}

# Comma-separated required claim set for Google OIDC ID tokens.
app.oidc.validation.required-claims.google=${APP_OIDC_REQUIRED_CLAIMS_GOOGLE:sub,email,iss,aud,exp,iat,nonce}

# Comma-separated required claim set for Microsoft OIDC ID tokens.
app.oidc.validation.required-claims.microsoft=${APP_OIDC_REQUIRED_CLAIMS_MICROSOFT:sub,iss,aud,exp,iat,nonce}

# Grace period (seconds) where just-rotated refresh token replay returns the same successor.
app.auth.refresh.rotation.grace-seconds=${APP_AUTH_REFRESH_ROTATION_GRACE_SECONDS:60}

# Enables session_version claim checks for optional global session invalidation.
app.auth.session-version.enabled=${APP_AUTH_SESSION_VERSION_ENABLED:true}

# Enables refresh token rotation on successful refresh requests.
app.auth.refresh.rotation.enabled=${APP_AUTH_REFRESH_ROTATION_ENABLED:true}

# Enables refresh reuse-detection kill switch behavior.
app.auth.refresh.reuse-detection.enabled=${APP_AUTH_REFRESH_REUSE_DETECTION_ENABLED:true}

# Strict reuse: any consumed-token presentation revokes the family (no grace replay tolerated).
# Default false — tolerates a single grace replay for legitimate races (e.g. parallel tabs).
app.auth.refresh.strict-reuse-detection=${APP_AUTH_REFRESH_STRICT_REUSE_DETECTION:false}

# Enables CSRF checks on cookie-backed refresh/logout endpoints.
app.auth.csrf.enabled=${APP_AUTH_CSRF_ENABLED:false}

# Requires Origin validation for CSRF-protected auth endpoints.
app.auth.csrf.require-origin-check=${APP_AUTH_CSRF_REQUIRE_ORIGIN_CHECK:true}

# Signed OAuth state validity window in seconds.
app.auth.oauth.state.ttl-seconds=${APP_AUTH_OAUTH_STATE_TTL_SECONDS:300}

# Enables auth endpoint throttling controls.
app.auth.rate-limit.enabled=${APP_AUTH_RATE_LIMIT_ENABLED:true}

# Per-minute budget for sign-in discovery/lookup endpoint.
app.auth.rate-limit.lookup.per-minute=${APP_AUTH_RATE_LIMIT_LOOKUP_PER_MINUTE:60}

# Per-minute budget for directory lookup endpoints (linked app-users/groups).
app.auth.rate-limit.directory.per-minute=${APP_AUTH_RATE_LIMIT_DIRECTORY_PER_MINUTE:60}

# Per-minute budget for OAuth callback endpoint.
app.auth.rate-limit.callback.per-minute=${APP_AUTH_RATE_LIMIT_CALLBACK_PER_MINUTE:60}

# Per-minute budget for refresh endpoint.
app.auth.rate-limit.refresh.per-minute=${APP_AUTH_RATE_LIMIT_REFRESH_PER_MINUTE:30}

# Per-minute budget for logout endpoint.
app.auth.rate-limit.logout.per-minute=${APP_AUTH_RATE_LIMIT_LOGOUT_PER_MINUTE:30}

# Per-minute budget for OAuth authorize endpoint.
app.auth.rate-limit.authorize.per-minute=${APP_AUTH_RATE_LIMIT_AUTHORIZE_PER_MINUTE:60}

# Per-minute budget for password sign-in initiation endpoint.
app.auth.rate-limit.sign-in-initiate.per-minute=${APP_AUTH_RATE_LIMIT_SIGN_IN_INITIATE_PER_MINUTE:30}

# Per-minute budget for password sign-in completion endpoint.
app.auth.rate-limit.sign-in-completion.per-minute=${APP_AUTH_RATE_LIMIT_SIGN_IN_COMPLETION_PER_MINUTE:30}

# Default scopes attached to newly issued machine/application access tokens.
app.auth.application.default-scopes=${APP_AUTH_APPLICATION_DEFAULT_SCOPES:application:api}

# Scope required by policy for machine/application token access to application-only endpoints.
app.auth.application.required-scope=${APP_AUTH_APPLICATION_REQUIRED_SCOPE:application:api}

# Scope required for integration machine endpoints.
app.auth.application.integration-scope=${APP_AUTH_APPLICATION_INTEGRATION_SCOPE:application:integration}

# Scope required for service machine endpoints.
app.auth.application.service-scope=${APP_AUTH_APPLICATION_SERVICE_SCOPE:application:service}

# Comma-separated endpoint prefixes reserved for machine/application tokens only.
app.auth.application.allowed-endpoint-prefixes=${APP_AUTH_APPLICATION_ALLOWED_ENDPOINT_PREFIXES:/auth/application/integration,/auth/application/service}

# Enables append-only auth audit event persistence with hash chaining.
app.audit.immutable.enabled=${APP_AUDIT_IMMUTABLE_ENABLED:true}

# Enables WORM (append-only file) sink for audit events.
app.audit.worm.enabled=${APP_AUDIT_WORM_ENABLED:true}

# Directory where WORM audit JSONL files are written.
app.audit.worm.directory=${APP_AUDIT_WORM_DIRECTORY:logs/audit-worm}

# Enables DPoP (RFC 9449) sender-constraint proof verification on protected endpoints.
app.auth.dpop.enabled=${APP_AUTH_DPOP_ENABLED:false}

# Shared bearer token for SCIM 2.0 provisioning endpoint authentication. Leave empty to disable SCIM.
#app.scim.bearer-token=${APP_SCIM_BEARER_TOKEN:}

# Maximum number of rows returned by directory-like lookup endpoints.
app.idp.directory.lookup.max-results=${APP_IDP_DIRECTORY_LOOKUP_MAX_RESULTS:100}

# Minimum query length required for directory-like lookup endpoints (anti-enumeration).
app.idp.directory.lookup.min-query-length=${APP_IDP_DIRECTORY_LOOKUP_MIN_QUERY_LENGTH:3}

# Enforces strict OIDC ID token validation checks (issuer, audience, alg allowlist, etc.).
app.oidc.validation.strict=${APP_OIDC_VALIDATION_STRICT:true}

# Enables JIT provisioning for eligible org users after IdP sign-in.
app.idp.jit.enabled=${APP_IDP_JIT_ENABLED:true}

# Lowest role JIT can assign; prevents privilege escalation from external claims.
app.idp.jit.role-floor=${APP_IDP_JIT_ROLE_FLOOR:ORG_MEMBER}

# Enables on-demand IdP directory lookup for explicit add-to-group/recipient actions.
app.idp.directory.on-demand.enabled=${APP_IDP_DIRECTORY_ON_DEMAND_ENABLED:true}

# Hard-disable bulk directory import behavior by policy.
app.idp.directory.bulk-import.enabled=${APP_IDP_DIRECTORY_BULK_IMPORT_ENABLED:false}

# Enables platform tier enforcement for per-org user caps.
app.org-tier.enforcement.enabled=${APP_ORG_TIER_ENFORCEMENT_ENABLED:true}

# Redis
quarkus.redis.hosts=${REDIS_HOSTS}
quarkus.redis.timeout=5s


