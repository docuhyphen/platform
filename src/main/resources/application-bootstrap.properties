# ============================================================================
# Bootstrap profile — one-time use to generate V1__initial.sql from current
# JPA entities. This profile is NOT for normal development or production use.
#
# Inherits from application-local.properties via Quarkus profile chaining:
#   mvn quarkus:dev -Dquarkus.profile=local,bootstrap
#
# Workflow (one-time, on a developer machine, with a throwaway dev DB):
#   1. Ensure your local Postgres DB exists and is empty (drop & recreate it).
#   2. Run: mvn quarkus:dev -Dquarkus.profile=local,bootstrap
#      - Hibernate will drop-and-create the schema in the DB
#      - Hibernate will also write the equivalent DDL to V1__initial.sql
#   3. Stop the app, inspect/clean up src/main/resources/db/migration/V1__initial.sql
#      (verify column order, add comments, sort statements if you like).
#   4. Drop & recreate the local DB again so it's empty.
#   5. Run normally: mvn quarkus:dev (profile defaults to `local`).
#      - Flyway applies V1__initial.sql → schema recreated cleanly
#      - Hibernate validates that entities match the migrated schema.
#
# After V1 is committed, all future schema changes go through new versioned
# migrations (V2__..., V3__..., etc.) — never edit V1__initial.sql again.
# ============================================================================

# Drop & recreate the schema so the captured DDL represents the full entity model.
quarkus.hibernate-orm.database.generation=drop-and-create

# Emit DDL as a Flyway-compatible script. Filename must follow Vn__description.sql.
quarkus.hibernate-orm.scripts.generation=create
quarkus.hibernate-orm.scripts.generation.create-target=src/main/resources/db/migration/V1__initial.sql

# Disable Flyway during bootstrap — there's no V1 to apply yet (we're creating it).
quarkus.flyway.migrate-at-start=false

# Disable Hibernate SQL logging here — we want the V1 file to be the artifact, not the console.
quarkus.hibernate-orm.log.sql=false
