# Production configuration
app.base-url=https://www.docuhyphen.com
app.email.subject-title=DocuHyphen

# Quarkus Mailer Configuration for Production
quarkus.mailer.from=no-reply@docuhyphen.com
quarkus.mailer.auth-methods=DIGEST-MD5

# Logging
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.file.enable=true
quarkus.log.file.path=logs/application.log
quarkus.log.file.level=INFO

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://prod-db-host:5432/doc-hyphen-db
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}

# Hibernate
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

# JWT secret source (production)
app.security.jwt.secret-provider=aws
app.security.aws.region=${AWS_REGION}
app.security.jwt.aws-secret-id=${JWT_SECRET_ID}

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=https://www.docuhyphen.com
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.access-control-max-age=24H

