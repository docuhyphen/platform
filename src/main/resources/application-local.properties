#quarkus.jaxrs.filter.classes=your.package.EndpointVerificationFilter

# Application Configuration
app.base-url=http://localhost:5173
app.email.subject-title=DocuHyphen
app.email.ses.region=${APP_EMAIL_SES_REGION:us-east-1}

# Quarkus Mailer Configuration
quarkus.mailer.from=support@docuhyphen.com
quarkus.mailer.host=localhost
quarkus.mailer.port=32768
quarkus.mailer.username=support@docuhyphen.com
quarkus.mailer.password=admin
quarkus.mailer.ssl=false

#Logging
quarkus.log.console.json=false
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{1.}] (%t) %s%e%n
quarkus.log.file.enable=true
quarkus.log.file.path=local-development-resources/logs/application.log
quarkus.log.file.level=DEBUG

# Hibernate ORM configuration,  Flyway owns the schema; Hibernate only validates.
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=no-file

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/docu-hyphen-postgres-db
#quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/docu-hyphen-postgres-db
quarkus.datasource.username=postgres
quarkus.datasource.password=admin

#Messaging
#mp.messaging.outgoing.organization-verification-out.connector=smallrye-kafka
#mp.messaging.outgoing.organization-verification-out.topic=organization-verification
#mp.messaging.outgoing.organization-verification-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
#mp.messaging.outgoing.organization-verification-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
#
#mp.messaging.incoming.organization-verification-in.connector=smallrye-kafka
#mp.messaging.incoming.organization-verification-in.topic=organization-verification
#mp.messaging.incoming.organization-verification-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
#mp.messaging.incoming.organization-verification-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer

quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD
quarkus.http.cors.headers=accept,if-match,idempotency-key,authorization,content-type,x-requested-with,x-active-organization-id,x-no-auth-access-token,x-request-access-token,x-request-session-token,x-csrf-token,x-share-link-token,x-client-type,x-tab-id,x-tab-token,x-request-id,dpop,dpop-nonce,dpop-bind
quarkus.http.cors.exposed-headers=location,link,set-cookie,etag,x-evidence-etag,content-disposition
quarkus.http.cors.access-control-max-age=24H

# File storage
file.storage.service=aws
file.storage.aws.bucket=${FILE_STORAGE_AWS_BUCKET:docuhyphen-demo-documents}
file.storage.aws.region=${FILE_STORAGE_AWS_REGION:us-east-1}

# Shorter access-token TTL in dev so refresh flow bugs surface immediately.
app.auth.access-token-default-minutes=5

# JWT secret source (local/dev)
app.security.jwt.secret-provider=local
app.security.jwt.local-secret=${JWT_SECRET:myverysecurekeythatis32byteslong*)&GAS&G_A(&F9*FDA(&_FD_A(&F+(D&FA}

# Redis
quarkus.redis.hosts=${REDIS_HOSTS:redis://localhost:6379}
quarkus.redis.timeout=5s

# Flyway: auto-repair on startup clears any failed migration record left by a previous run
# (e.g. V30 failing on a dev DB with pre-existing null-owner exchanges before the backfill was added).
quarkus.flyway.repair-at-start=true
