services:
  quarkus-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docu-hyphen-app
    ports:
      - "8080:8080"
      - "5005:5005"
    volumes:
      - ./local-development-resources:/app/local-development-resources
      - type: bind
        source: ${AWS_CONFIG_DIRECTORY}
        target: /home/appuser/.aws
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_PROFILE: local
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/docu-hyphen-postgres-db
      REDIS_HOSTS: redis://redis:6379
      AWS_PROFILE: ${AWS_PROFILE:-docuhyphen-local}
      AWS_CONFIG_FILE: /home/appuser/.aws/config
      AWS_LOGIN_CACHE_DIRECTORY: /home/appuser/.aws/login/cache
      FILE_STORAGE_AWS_BUCKET: ${FILE_STORAGE_AWS_BUCKET:-docuhyphen-demo-documents}
      FILE_STORAGE_AWS_REGION: ${FILE_STORAGE_AWS_REGION:-us-east-1}
      APP_EMAIL_SES_REGION: ${APP_EMAIL_SES_REGION:-us-east-1}
      QUARKUS_MAILER_FROM: ${QUARKUS_MAILER_FROM:-support@docuhyphen.com}
      APP_ADMIN_BOOTSTRAP_EMAIL: ${APP_ADMIN_BOOTSTRAP_EMAIL:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:8080/auth/oauth/MICROSOFT/callback}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/auth/oauth/GOOGLE/callback}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:15
    container_name: docu-hyphen-postgres-db
    environment:
      POSTGRES_DB: docu-hyphen-postgres-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docu-hyphen-postgres-db"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: always

  redis:
    image: redis:7-alpine
    container_name: doc-hyphen-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: always

volumes:
  postgres-data:
  redis-data:
