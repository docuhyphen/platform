<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sharing Session Demo Data Generator</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2a37;
      --muted: #5f6b7a;
      --line: #dbe3ef;
      --accent: #2f7a4c;
      --accent-soft: #d9f5e2;
      --warn-soft: #fff5c2;
      --error-soft: #f9d6d6;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #edf6ef 0%, #f5f7fb 45%, #fff9da 100%);
      color: var(--text);
    }

    .container {
      max-width: 980px;
      margin: 24px auto;
      padding: 0 16px 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 3px 10px rgba(25, 40, 65, 0.08);
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .sub {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    input {
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
      padding: 10px 11px;
      outline: none;
    }

    input:focus {
      border-color: #8bb79b;
      box-shadow: 0 0 0 3px rgba(47, 122, 76, 0.12);
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-generate {
      background: var(--accent);
      color: #fff;
    }

    .btn-clear {
      background: var(--warn-soft);
      color: #503f00;
    }

    .btn-generate:disabled {
      background: #9db9a8;
      cursor: not-allowed;
    }

    .status {
      margin-top: 14px;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      border: 1px solid var(--line);
      background: var(--accent-soft);
    }

    .status[data-state="error"] {
      background: var(--error-soft);
      border-color: #eab0b0;
    }

    .log {
      margin-top: 14px;
      background: #0f172a;
      color: #d9e8ff;
      border-radius: 8px;
      padding: 10px;
      min-height: 240px;
      max-height: 420px;
      overflow: auto;
      white-space: pre-wrap;
      line-height: 1.45;
      font-family: Consolas, monospace;
      font-size: 12px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1 class="title">Sharing Session Demo Data Generator</h1>
      <p class="sub">Automates sign-up, sign-in (OTP 123456), person/org registration, then creates sharing sessions (3 to 6 docs each).</p>

      <div class="grid">
        <div class="field">
          <label for="baseUrl">Base URL</label>
          <input id="baseUrl" type="text" value="http://localhost:8080" />
        </div>
        <div class="field">
          <label for="emailDomain">Generated Account Email Domain</label>
          <input id="emailDomain" type="text" value="doc-hyphen.com" />
        </div>
        <div class="field">
          <label for="password">Generated Account Password</label>
          <input id="password" type="text" value="StrongPassword1!" />
        </div>
        <div class="field">
          <label for="sessionsPerIndustry">Sessions per Industry</label>
          <input id="sessionsPerIndustry" type="number" min="1" value="20" />
        </div>
        <div class="field">
          <label for="delayMs">Delay Between Requests (ms)</label>
          <input id="delayMs" type="number" min="0" value="140" />
        </div>
      </div>

      <div class="actions">
        <button id="generateBtn" class="btn-generate">Generate Demo Sessions</button>
        <button id="clearBtn" class="btn-clear">Clear Log</button>
      </div>

      <div id="status" class="status" data-state="ok">Idle</div>
      <div id="log" class="log"></div>
    </div>
  </div>

  <script src="./demo-sharing-session-generator.js"></script>
</body>
</html>
